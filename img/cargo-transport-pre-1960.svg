<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 8 936 424" width="1120" height="507" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <filter id="cargoShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="12" y="8" width="936" height="424" rx="16" fill="#f8fafc"/>

  <!-- Top Half: Multiplicity of Goods -->
  <rect x="24" y="20" width="912" height="176" rx="16" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <rect x="38" y="34" width="210" height="30" rx="8" fill="#d97706"/>
  <text x="143" y="54" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">MULTIPLICITY OF GOODS</text>
  <text x="916" y="54" text-anchor="end" font-size="13" font-weight="700" fill="#92400e">Do goods damage or contaminate each other (e.g. coffee next to spices)?</text>

  <g filter="url(#cargoShadow)" text-anchor="middle">
    <rect x="38" y="76" width="168" height="102" rx="12" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <text x="122" y="112" font-size="26">📦</text>
    <text x="122" y="142" font-size="14" font-weight="800" fill="#0f172a">Wooden Crates</text>
    <text x="122" y="160" font-size="11.5" fill="#64748b">Fragile dimensions</text>

    <rect x="218" y="76" width="168" height="102" rx="12" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <text x="302" y="112" font-size="26">🛢️</text>
    <text x="302" y="142" font-size="14" font-weight="800" fill="#0f172a">Chemical Drums</text>
    <text x="302" y="160" font-size="11.5" fill="#64748b">Hazardous liquids</text>

    <rect x="398" y="76" width="168" height="102" rx="12" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <text x="482" y="112" font-size="26">🚗</text>
    <text x="482" y="142" font-size="14" font-weight="800" fill="#0f172a">Automobiles</text>
    <text x="482" y="160" font-size="11.5" fill="#64748b">Heavy &amp; custom ramps</text>

    <rect x="578" y="76" width="168" height="102" rx="12" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <text x="662" y="112" font-size="26">🌾</text>
    <text x="662" y="142" font-size="14" font-weight="800" fill="#0f172a">Coffee &amp; Spices</text>
    <text x="662" y="160" font-size="11.5" fill="#64748b">Jute sacks (moisture)</text>

    <rect x="758" y="76" width="164" height="102" rx="12" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
    <text x="840" y="112" font-size="26">🎹</text>
    <text x="840" y="142" font-size="14" font-weight="800" fill="#0f172a">Luxury Goods</text>
    <text x="840" y="160" font-size="11.5" fill="#64748b">Irregular shapes</text>
  </g>

  <!-- Center Friction Divider -->
  <line x1="36" y1="220" x2="924" y2="220" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 6"/>
  <rect x="315" y="203" width="330" height="34" rx="999" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
  <text x="480" y="225" text-anchor="middle" font-size="13" font-weight="800" fill="#dc2626">Manual Unloading &amp; Repacking at Every Hop</text>

  <!-- Bottom Half: Multiplicity of Transport Methods -->
  <rect x="24" y="244" width="912" height="176" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="38" y="258" width="260" height="30" rx="8" fill="#0f172a"/>
  <text x="168" y="278" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">MULTIPLICITY OF TRANSPORT MODES</text>
  <text x="916" y="278" text-anchor="end" font-size="13" font-weight="700" fill="#334155">Can we transfer smoothly from ship → train → truck?</text>

  <g filter="url(#cargoShadow)" text-anchor="middle">
    <rect x="38" y="302" width="168" height="98" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="122" y="336" font-size="24">🚚</text>
    <text x="122" y="362" font-size="14" font-weight="800" fill="#0f172a">Freight Trucks</text>
    <text x="122" y="380" font-size="11.5" fill="#64748b">Road delivery</text>

    <rect x="218" y="302" width="168" height="98" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="302" y="336" font-size="24">🚂</text>
    <text x="302" y="362" font-size="14" font-weight="800" fill="#0f172a">Rail Boxcars</text>
    <text x="302" y="380" font-size="11.5" fill="#64748b">Continental rail</text>

    <rect x="398" y="302" width="168" height="98" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="482" y="336" font-size="24">🏗️</text>
    <text x="482" y="362" font-size="14" font-weight="800" fill="#0f172a">Port Cranes &amp; Nets</text>
    <text x="482" y="380" font-size="11.5" fill="#64748b">Weeks in port</text>

    <rect x="578" y="302" width="168" height="98" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="662" y="336" font-size="24">🚢</text>
    <text x="662" y="362" font-size="14" font-weight="800" fill="#0f172a">Break-Bulk Ships</text>
    <text x="662" y="380" font-size="11.5" fill="#64748b">Manual stowage</text>

    <rect x="758" y="302" width="164" height="98" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="840" y="336" font-size="24">🏭</text>
    <text x="840" y="362" font-size="14" font-weight="800" fill="#0f172a">Warehouses</text>
    <text x="840" y="380" font-size="11.5" fill="#64748b">Custom racking</text>
  </g>
</svg>
