<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 920 408" width="1120" height="497" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="layerBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="layerArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <filter id="layerShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="920" height="408" rx="16" fill="#f8fafc"/>

  <!-- Left Column: Dockerfile & Storage Driver Details -->
  <g filter="url(#layerShadow)">
    <rect x="28" y="28" width="330" height="174" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="50" y="58" font-size="13.5" font-weight="800" fill="#93c5fd">Dockerfile Instructions</text>
    <g font-family="'JetBrains Mono', monospace" font-size="12.5" fill="#f8fafc">
      <text x="50" y="88"><tspan fill="#38bdf8">FROM</tspan> ubuntu:24.04</text>
      <text x="50" y="114"><tspan fill="#38bdf8">RUN</tspan> apt install -y python3</text>
      <text x="50" y="140"><tspan fill="#38bdf8">COPY</tspan> app.py /opt/myapp/</text>
      <text x="50" y="166"><tspan fill="#38bdf8">CMD</tspan> ["python3", "/opt/myapp/app.py"]</text>
    </g>

    <rect x="28" y="222" width="330" height="190" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="50" y="254" font-size="14.5" font-weight="800" fill="#0f172a">OverlayFS Storage Driver</text>
    <g font-size="13" fill="#334155">
      <text x="50" y="284">• <tspan font-family="'JetBrains Mono', monospace" font-weight="700" fill="#059669">merged</tspan>: Unified container view</text>
      <text x="50" y="312">• <tspan font-family="'JetBrains Mono', monospace" font-weight="700" fill="#d97706">upperdir</tspan>: Thin Read-Write layer</text>
      <text x="50" y="340">• <tspan font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1d4ed8">lowerdir</tspan>: Immutable Image layers</text>
      <text x="50" y="368">• <tspan font-weight="700" fill="#0f172a">Copy-on-Write (CoW)</tspan>: Files are</text>
      <text x="62" y="388">copied to upperdir only when modified</text>
    </g>
  </g>

  <!-- Right Column: Stacked Layers -->
  <g filter="url(#layerShadow)" text-anchor="middle">
    <!-- Top: Unified Merged View -->
    <rect x="440" y="28" width="484" height="66" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="682" y="56" font-size="15" font-weight="800" fill="#065f46">Merged Container Filesystem View (/bin, /etc, /opt/myapp)</text>
    <text x="682" y="78" font-size="12.5" font-family="'JetBrains Mono', monospace" fill="#047857">OverlayFS Union Mount + Isolated Namespaces &amp; Cgroups</text>

    <!-- Thin Read-Write Layer (Container Layer) -->
    <rect x="440" y="112" width="484" height="66" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="682" y="140" font-size="15" font-weight="800" fill="#92400e">Thin Read-Write Layer (Container Layer — upperdir)</text>
    <text x="682" y="162" font-size="12.5" font-family="'JetBrains Mono', monospace" fill="#b45309">Ephemeral runtime changes • Deleted when container is removed</text>

    <!-- Immutable Read-Only Image Layers (lowerdir) -->
    <rect x="440" y="198" width="484" height="214" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="682" y="224" font-size="14" font-weight="800" fill="#1e40af">Immutable Read-Only Image Layers (lowerdir — Shared Across Containers)</text>

    <rect x="464" y="238" width="436" height="46" rx="8" fill="url(#layerBlue)"/>
    <text x="682" y="266" font-size="13.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#ffffff">Layer 3: COPY app.py /opt/myapp/ (sha256:a669... • 12 KB)</text>

    <rect x="464" y="294" width="436" height="46" rx="8" fill="url(#layerBlue)"/>
    <text x="682" y="322" font-size="13.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#ffffff">Layer 2: RUN apt install -y python3 (sha256:22ae... • 42 MB)</text>

    <rect x="464" y="350" width="436" height="46" rx="8" fill="url(#layerBlue)"/>
    <text x="682" y="378" font-size="13.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#ffffff">Layer 1: FROM ubuntu:24.04 Base Rootfs (sha256:71cb... • 78 MB)</text>
  </g>

  <!-- Connector Arrows -->
  <line x1="358" y1="280" x2="432" y2="61" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#layerArrow)"/>
  <line x1="358" y1="308" x2="432" y2="145" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#layerArrow)"/>
  <line x1="358" y1="336" x2="432" y2="305" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#layerArrow)"/>
</svg>
