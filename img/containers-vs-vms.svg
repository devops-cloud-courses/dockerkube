<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="cvmBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="cvmShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="440" rx="16" fill="#f8fafc"/>

  <!-- Left Side: Containers -->
  <rect x="24" y="20" width="442" height="400" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="245" y="52" text-anchor="middle" font-size="17" font-weight="800" fill="#1e40af">Containers (OS-Level Virtualization)</text>
  <text x="245" y="74" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#059669" font-weight="700">Starts in milliseconds • MBs in size • Shared Kernel</text>

  <g filter="url(#cvmShadow)" text-anchor="middle">
    <!-- 4 Container columns -->
    <rect x="44" y="92" width="92" height="142" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="52" y="102" width="76" height="68" rx="6" fill="url(#cvmBlue)"/>
    <text x="90" y="141" font-size="13" font-weight="800" fill="#ffffff">App A</text>
    <rect x="52" y="178" width="76" height="46" rx="6" fill="#dbeafe"/>
    <text x="90" y="206" font-size="11" font-weight="700" fill="#1e40af">Bins / Libs</text>

    <rect x="147" y="92" width="92" height="142" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="155" y="102" width="76" height="68" rx="6" fill="url(#cvmBlue)"/>
    <text x="193" y="141" font-size="13" font-weight="800" fill="#ffffff">App B</text>
    <rect x="155" y="178" width="76" height="46" rx="6" fill="#dbeafe"/>
    <text x="193" y="206" font-size="11" font-weight="700" fill="#1e40af">Bins / Libs</text>

    <rect x="250" y="92" width="92" height="142" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="258" y="102" width="76" height="68" rx="6" fill="url(#cvmBlue)"/>
    <text x="296" y="141" font-size="13" font-weight="800" fill="#ffffff">App C</text>
    <rect x="258" y="178" width="76" height="46" rx="6" fill="#dbeafe"/>
    <text x="296" y="206" font-size="11" font-weight="700" fill="#1e40af">Bins / Libs</text>

    <rect x="353" y="92" width="92" height="142" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="361" y="102" width="76" height="68" rx="6" fill="url(#cvmBlue)"/>
    <text x="399" y="141" font-size="13" font-weight="800" fill="#ffffff">App D</text>
    <rect x="361" y="178" width="76" height="46" rx="6" fill="#dbeafe"/>
    <text x="399" y="206" font-size="11" font-weight="700" fill="#1e40af">Bins / Libs</text>

    <!-- Container Runtime -->
    <rect x="44" y="248" width="401" height="46" rx="10" fill="#0284c7"/>
    <text x="245" y="276" font-size="14" font-weight="800" fill="#ffffff">Container Runtime (Docker / containerd)</text>

    <!-- Host Operating System -->
    <rect x="44" y="304" width="401" height="46" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="245" y="332" font-size="14" font-weight="800" fill="#0f172a">Shared Host Operating System (Linux Kernel)</text>

    <!-- Infrastructure -->
    <rect x="44" y="360" width="401" height="44" rx="10" fill="#10b981"/>
    <text x="245" y="387" font-size="14" font-weight="800" fill="#ffffff">Physical / Cloud Infrastructure</text>
  </g>

  <!-- Right Side: Virtual Machines -->
  <rect x="494" y="20" width="442" height="400" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="715" y="52" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">Virtual Machines (Hardware Virtualization)</text>
  <text x="715" y="74" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#dc2626" font-weight="700">Starts in minutes • GBs in size • Full Guest OS per VM</text>

  <g filter="url(#cvmShadow)" text-anchor="middle">
    <!-- 3 Heavy VM columns -->
    <rect x="514" y="92" width="124" height="202" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="576" y="112" font-size="11.5" font-weight="800" fill="#475569">VM 1</text>
    <rect x="524" y="120" width="104" height="46" rx="6" fill="#3b82f6"/>
    <text x="576" y="148" font-size="13" font-weight="800" fill="#ffffff">App A</text>
    <rect x="524" y="172" width="104" height="36" rx="6" fill="#dbeafe"/>
    <text x="576" y="195" font-size="11" font-weight="700" fill="#1e40af">Bins / Libs</text>
    <rect x="524" y="214" width="104" height="70" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="576" y="246" font-size="12" font-weight="800" fill="#dc2626">Guest OS</text>
    <text x="576" y="266" font-size="10" font-family="'JetBrains Mono', monospace" fill="#991b1b">Full Kernel</text>

    <rect x="653" y="92" width="124" height="202" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="715" y="112" font-size="11.5" font-weight="800" fill="#475569">VM 2</text>
    <rect x="663" y="120" width="104" height="46" rx="6" fill="#3b82f6"/>
    <text x="715" y="148" font-size="13" font-weight="800" fill="#ffffff">App B</text>
    <rect x="663" y="172" width="104" height="36" rx="6" fill="#dbeafe"/>
    <text x="715" y="195" font-size="11" font-weight="700" fill="#1e40af">Bins / Libs</text>
    <rect x="663" y="214" width="104" height="70" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="715" y="246" font-size="12" font-weight="800" fill="#dc2626">Guest OS</text>
    <text x="715" y="266" font-size="10" font-family="'JetBrains Mono', monospace" fill="#991b1b">Full Kernel</text>

    <rect x="792" y="92" width="124" height="202" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="854" y="112" font-size="11.5" font-weight="800" fill="#475569">VM 3</text>
    <rect x="802" y="120" width="104" height="46" rx="6" fill="#3b82f6"/>
    <text x="854" y="148" font-size="13" font-weight="800" fill="#ffffff">App C</text>
    <rect x="802" y="172" width="104" height="36" rx="6" fill="#dbeafe"/>
    <text x="854" y="195" font-size="11" font-weight="700" fill="#1e40af">Bins / Libs</text>
    <rect x="802" y="214" width="104" height="70" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="854" y="246" font-size="12" font-weight="800" fill="#dc2626">Guest OS</text>
    <text x="854" y="266" font-size="10" font-family="'JetBrains Mono', monospace" fill="#991b1b">Full Kernel</text>

    <!-- Hypervisor -->
    <rect x="514" y="304" width="402" height="46" rx="10" fill="#475569"/>
    <text x="715" y="332" font-size="14" font-weight="800" fill="#ffffff">Hypervisor (KVM / VMware ESXi / Hyper-V)</text>

    <!-- Infrastructure -->
    <rect x="514" y="360" width="402" height="44" rx="10" fill="#10b981"/>
    <text x="715" y="387" font-size="14" font-weight="800" fill="#ffffff">Physical / Cloud Infrastructure</text>
  </g>
</svg>
