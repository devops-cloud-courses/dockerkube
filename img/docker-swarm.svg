<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 1 924 406" width="1120" height="492" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="18" y="1" width="924" height="406" rx="16" fill="#f8fafc"/>

  <!-- Manager Nodes Plane -->
  <rect x="30" y="25" width="900" height="150" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="13" width="290" height="24" rx="12" fill="#2563eb"/>
  <text x="195" y="29" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">SWARM MANAGER NODES (RAFT CONSENSUS)</text>

  <!-- Manager 1 (Leader) -->
  <rect x="65" y="55" width="250" height="100" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="195" y="65" width="105" height="20" rx="10" fill="#2563eb"/>
  <text x="247" y="79" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">RAFT LEADER</text>
  <text x="130" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e40af">Manager 1</text>
  <text x="190" y="110" text-anchor="middle" font-size="12" fill="#334155">Orchestrator &amp; Scheduler</text>
  <text x="190" y="132" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#2563eb">Cluster State Store (Raft)</text>

  <!-- Manager 2 -->
  <rect x="355" y="55" width="250" height="100" rx="10" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="495" y="65" width="95" height="20" rx="10" fill="#dbeafe"/>
  <text x="542" y="79" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">FOLLOWER</text>
  <text x="420" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e3a8a">Manager 2</text>
  <text x="480" y="110" text-anchor="middle" font-size="12" fill="#475569">High-Availability Standby</text>
  <text x="480" y="132" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#3b82f6">Raft Log Replica</text>

  <!-- Manager 3 -->
  <rect x="645" y="55" width="250" height="100" rx="10" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="785" y="65" width="95" height="20" rx="10" fill="#dbeafe"/>
  <text x="832" y="79" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">FOLLOWER</text>
  <text x="710" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e3a8a">Manager 3</text>
  <text x="770" y="110" text-anchor="middle" font-size="12" fill="#475569">High-Availability Standby</text>
  <text x="770" y="132" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#3b82f6">Raft Log Replica</text>

  <!-- Raft arrows -->
  <line x1="315" y1="105" x2="353" y2="105" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowBlue)" marker-start="url(#arrowBlue)"/>
  <line x1="605" y1="105" x2="643" y2="105" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowBlue)" marker-start="url(#arrowBlue)"/>

  <!-- Dispatch arrows to workers -->
  <line x1="190" y1="175" x2="190" y2="215" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <line x1="480" y1="175" x2="480" y2="215" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <line x1="770" y1="175" x2="770" y2="215" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="380" y="184" width="200" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="480" y="199" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">Task Dispatch (mTLS gRPC)</text>

  <!-- Worker Nodes Plane -->
  <rect x="30" y="220" width="900" height="175" rx="14" fill="#ffffff" stroke="#a7f3d0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="208" width="240" height="24" rx="12" fill="#059669"/>
  <text x="170" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">WORKER NODES (TASK EXECUTION)</text>

  <!-- Worker 1 -->
  <rect x="65" y="250" width="250" height="125" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="190" y="272" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">Worker Node 1</text>
  <rect x="80" y="285" width="105" height="72" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="132" y="312" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#065f46">Task: web.1</text>
  <text x="132" y="335" text-anchor="middle" font-size="11.5" fill="#047857">nginx:1.27</text>
  <rect x="195" y="285" width="105" height="72" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="247" y="312" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#3730a3">Task: api.1</text>
  <text x="247" y="335" text-anchor="middle" font-size="11.5" fill="#4338ca">node:22</text>

  <!-- Worker 2 -->
  <rect x="355" y="250" width="250" height="125" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="272" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">Worker Node 2</text>
  <rect x="370" y="285" width="105" height="72" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="422" y="312" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#065f46">Task: web.2</text>
  <text x="422" y="335" text-anchor="middle" font-size="11.5" fill="#047857">nginx:1.27</text>
  <rect x="485" y="285" width="105" height="72" rx="8" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="537" y="312" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#92400e">Task: redis.1</text>
  <text x="537" y="335" text-anchor="middle" font-size="11.5" fill="#b45309">redis:7</text>

  <!-- Worker 3 -->
  <rect x="645" y="250" width="250" height="125" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="770" y="272" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">Worker Node 3</text>
  <rect x="660" y="285" width="105" height="72" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="712" y="312" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#065f46">Task: web.3</text>
  <text x="712" y="335" text-anchor="middle" font-size="11.5" fill="#047857">nginx:1.27</text>
  <rect x="775" y="285" width="105" height="72" rx="8" fill="#eef2ff" stroke="#818cf8"/>
  <text x="827" y="312" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#3730a3">Task: api.2</text>
  <text x="827" y="335" text-anchor="middle" font-size="11.5" fill="#4338ca">node:22</text>
</svg>
