<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 18 1044 444" width="1120" height="476" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Left Panel: Docker (Daemon-based) -->
  <rect x="40" y="30" width="490" height="420" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="30" width="490" height="50" rx="16" fill="#eff6ff"/>
  <rect x="40" y="64" width="490" height="16" fill="#eff6ff"/>
  <line x1="40" y1="80" x2="530" y2="80" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="285" y="61" text-anchor="middle" font-size="18" font-weight="800" fill="#1d4ed8">DOCKER — CLIENT / SERVER DAEMON</text>

  <!-- Docker CLI -->
  <rect x="165" y="98" width="240" height="48" rx="10" fill="#1e293b"/>
  <text x="285" y="121" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#38bdf8">docker CLI</text>
  <text x="285" y="138" text-anchor="middle" font-size="11.5" font-weight="500" fill="#cbd5e1">User Space Client</text>

  <!-- Arrow CLI -> dockerd -->
  <line x1="285" y1="146" x2="285" y2="184" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="195" y="153" width="180" height="22" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="285" y="168" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#1d4ed8">REST API (/var/run/docker.sock)</text>

  <!-- Root Boundary Box -->
  <rect x="68" y="188" width="434" height="240" rx="12" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="84" y="178" width="190" height="20" rx="5" fill="#ffe4e6" stroke="#fda4af" stroke-width="1"/>
  <text x="179" y="192" text-anchor="middle" font-size="11" font-weight="700" fill="#be123c">PRIVILEGED ROOT CONTEXT</text>

  <!-- dockerd + containerd -->
  <rect x="95" y="208" width="380" height="62" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="285" y="233" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#1e3a8a">dockerd  →  containerd</text>
  <text x="285" y="254" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">Persistent Background Daemons (Single Point of Failure)</text>

  <!-- Arrows to runc/containers -->
  <line x1="185" y1="270" x2="185" y2="306" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="385" y1="270" x2="385" y2="306" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Container 1 -->
  <rect x="95" y="310" width="180" height="72" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="185" y="334" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#1d4ed8">containerd-shim + runc</text>
  <rect x="115" y="344" width="140" height="26" rx="6" fill="#2563eb"/>
  <text x="185" y="361" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Container A (nginx)</text>

  <!-- Container 2 -->
  <rect x="295" y="310" width="180" height="72" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="385" y="334" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#1d4ed8">containerd-shim + runc</text>
  <rect x="315" y="344" width="140" height="26" rx="6" fill="#2563eb"/>
  <text x="385" y="361" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Container B (redis)</text>

  <text x="285" y="408" text-anchor="middle" font-size="12" font-weight="600" fill="#be123c">⚠ Daemon crash or socket compromise affects all containers</text>

  <!-- Right Panel: Podman (Daemonless & Rootless) -->
  <rect x="570" y="30" width="490" height="420" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2" filter="url(#shadow)"/>
  <rect x="570" y="30" width="490" height="50" rx="16" fill="#f5f3ff"/>
  <rect x="570" y="64" width="490" height="16" fill="#f5f3ff"/>
  <line x1="570" y1="80" x2="1060" y2="80" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="815" y="61" text-anchor="middle" font-size="18" font-weight="800" fill="#6d28d9">PODMAN — DAEMONLESS &amp; ROOTLESS</text>

  <!-- Rootless User Context Box -->
  <rect x="598" y="94" width="434" height="334" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="614" y="84" width="245" height="20" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="736" y="98" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">UNPRIVILEGED USER NAMESPACE (ROOTLESS)</text>

  <!-- Podman CLI -->
  <rect x="695" y="114" width="240" height="52" rx="10" fill="#4c1d95"/>
  <text x="815" y="138" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#e9d5ff">podman CLI</text>
  <text x="815" y="155" text-anchor="middle" font-size="11.5" font-weight="500" fill="#ddd6fe">alias docker=podman (OCI-compatible)</text>

  <!-- Direct fork/exec banner -->
  <rect x="640" y="182" width="350" height="36" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="815" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Direct fork/exec — No Background Daemon</text>

  <!-- Arrows to conmon + crun -->
  <line x1="715" y1="218" x2="715" y2="254" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="915" y1="218" x2="915" y2="254" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Container 1 -->
  <rect x="625" y="258" width="180" height="78" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="715" y="282" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#6d28d9">conmon + crun / runc</text>
  <rect x="645" y="294" width="140" height="28" rx="6" fill="#7c3aed"/>
  <text x="715" y="313" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Container A (UID 1000)</text>

  <!-- Pod / Container 2 -->
  <rect x="825" y="258" width="180" height="78" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="915" y="282" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#6d28d9">conmon + crun / runc</text>
  <rect x="845" y="294" width="140" height="28" rx="6" fill="#7c3aed"/>
  <text x="915" y="313" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Pod (Infra + App)</text>

  <!-- Native Integrations Footer -->
  <rect x="625" y="352" width="380" height="36" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="815" y="375" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#166534">✓ systemd Quadlets   •   ✓ podman kube play / generate</text>

  <text x="815" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">✓ Isolated per user — least-privilege security by default</text>
</svg>
