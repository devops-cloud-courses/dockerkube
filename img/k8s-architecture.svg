<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 12 936 416" width="1120" height="498" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="cpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <marker id="k8sArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <filter id="k8sShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="936" height="416" rx="16" fill="#f8fafc"/>

  <!-- Left: Control Plane -->
  <rect x="24" y="24" width="420" height="392" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="234" y="54" text-anchor="middle" font-size="16" font-weight="800" fill="#1e40af">Control Plane</text>

  <g filter="url(#k8sShadow)">
    <!-- kube-apiserver -->
    <rect x="52" y="176" width="364" height="74" rx="12" fill="url(#cpGrad)"/>
    <text x="234" y="209" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">kube-apiserver</text>
    <text x="234" y="231" text-anchor="middle" font-size="12.5" font-family="'JetBrains Mono', monospace" fill="#dbeafe">Front-end REST API • AuthN / AuthZ / Admission</text>

    <!-- Top row: controller-manager & cloud-controller-manager -->
    <rect x="52" y="76" width="174" height="68" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="139" y="105" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">kube-controller-mgr</text>
    <text x="139" y="125" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#64748b">Reconciliation loops</text>

    <rect x="242" y="76" width="174" height="68" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="329" y="105" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">cloud-controller-mgr</text>
    <text x="329" y="125" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#64748b">Cloud LBs, Nodes, Routes</text>

    <!-- Bottom row: etcd & scheduler -->
    <rect x="52" y="286" width="174" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="139" y="322" text-anchor="middle" font-size="14.5" font-weight="800" fill="#0f172a">etcd</text>
    <text x="139" y="344" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#2563eb">Consistent Key-Value</text>
    <text x="139" y="362" text-anchor="middle" font-size="11.5" fill="#64748b">Cluster state store</text>

    <rect x="242" y="286" width="174" height="96" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="329" y="322" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">kube-scheduler</text>
    <text x="329" y="344" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#4f46e5">Placement engine</text>
    <text x="329" y="362" text-anchor="middle" font-size="11.5" fill="#64748b">Assigns Pods to Nodes</text>
  </g>

  <!-- Control plane internal arrows -->
  <line x1="139" y1="144" x2="139" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#k8sArrow)"/>
  <line x1="329" y1="144" x2="329" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#k8sArrow)"/>
  <line x1="139" y1="250" x2="139" y2="280" stroke="#2563eb" stroke-width="2" marker-end="url(#k8sArrow)"/>
  <line x1="329" y1="286" x2="329" y2="256" stroke="#2563eb" stroke-width="2" marker-end="url(#k8sArrow)"/>

  <!-- Right: Worker Nodes -->
  <rect x="482" y="24" width="454" height="392" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="709" y="54" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Worker Nodes (Data Plane)</text>

  <!-- Worker Node 1 -->
  <g filter="url(#k8sShadow)">
    <rect x="506" y="76" width="202" height="314" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="607" y="104" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e40af">Worker Node 1</text>

    <rect x="524" y="118" width="166" height="46" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="607" y="140" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">kubelet</text>
    <text x="607" y="156" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#64748b">Node Agent &amp; Probes</text>

    <rect x="524" y="174" width="166" height="46" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="607" y="196" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">kube-proxy / CNI</text>
    <text x="607" y="212" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#64748b">Service VIPs &amp; eBPF/IPVS</text>

    <rect x="524" y="232" width="166" height="140" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="607" y="254" text-anchor="middle" font-size="12.5" font-weight="800" fill="#065f46">CRI Runtime (containerd)</text>
    <rect x="536" y="266" width="66" height="90" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <text x="569" y="305" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">Pod A</text>
    <text x="569" y="325" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#059669">App + Net</text>

    <rect x="612" y="266" width="66" height="90" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <text x="645" y="305" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">Pod B</text>
    <text x="645" y="325" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#059669">App + Net</text>
  </g>

  <!-- Worker Node 2 -->
  <g filter="url(#k8sShadow)">
    <rect x="720" y="76" width="202" height="314" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="821" y="104" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e40af">Worker Node 2</text>

    <rect x="738" y="118" width="166" height="46" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="821" y="140" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">kubelet</text>
    <text x="821" y="156" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#64748b">Node Agent &amp; Probes</text>

    <rect x="738" y="174" width="166" height="46" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="821" y="196" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">kube-proxy / CNI</text>
    <text x="821" y="212" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#64748b">Service VIPs &amp; eBPF/IPVS</text>

    <rect x="738" y="232" width="166" height="140" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="821" y="254" text-anchor="middle" font-size="12.5" font-weight="800" fill="#065f46">CRI Runtime (containerd)</text>
    <rect x="750" y="266" width="142" height="90" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <text x="821" y="305" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">Pod C (Replica)</text>
    <text x="821" y="325" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#059669">Containers + Volumes</text>
  </g>

  <!-- API Server to Kubelet / Kube-proxy arrows -->
  <path d="M 416 205 L 462 205 L 462 141 L 518 141" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#k8sArrow)"/>
  <path d="M 416 220 L 518 197" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#k8sArrow)"/>
</svg>
