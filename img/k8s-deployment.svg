<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 23 919 314" width="1120" height="383" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect x="18" y="23" width="919" height="314" rx="16" fill="#f8fafc"/>

  <!-- Deployment Card -->
  <rect x="30" y="95" width="220" height="170" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="83" width="130" height="24" rx="12" fill="#2563eb"/>
  <text x="115" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">DEPLOYMENT</text>
  <text x="140" y="135" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14.5" font-weight="800" fill="#0f172a">web-app</text>
  <rect x="50" y="152" width="180" height="90" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="65" y="175" font-family="'JetBrains Mono', monospace" font-size="12" fill="#1e40af">replicas: <tspan font-weight="800">3</tspan></text>
  <text x="65" y="196" font-family="'JetBrains Mono', monospace" font-size="12" fill="#1e40af">image: <tspan font-weight="700">app:v1.4</tspan></text>
  <text x="65" y="217" font-family="'JetBrains Mono', monospace" font-size="12" fill="#1e40af">strategy: <tspan font-weight="700">Rolling</tspan></text>

  <!-- Arrow Deployment -> ReplicaSet -->
  <line x1="250" y1="180" x2="315" y2="180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="282" y="168" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563eb">manages</text>

  <!-- ReplicaSet Card -->
  <rect x="320" y="95" width="215" height="170" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="340" y="83" width="130" height="24" rx="12" fill="#4f46e5"/>
  <text x="405" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">REPLICASET</text>
  <text x="427" y="135" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="800" fill="#0f172a">web-app-7d9f8b</text>
  <rect x="340" y="152" width="175" height="90" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="427" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">Control Loop</text>
  <text x="427" y="198" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#4338ca">Desired = 3</text>
  <text x="427" y="218" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#059669">Ready = 3 / 3</text>

  <!-- Arrows ReplicaSet -> Pods -->
  <path d="M 535 150 L 605 80" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arrowIndigo)"/>
  <path d="M 535 180 L 605 180" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arrowIndigo)"/>
  <path d="M 535 210 L 605 280" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arrowIndigo)"/>

  <!-- Pod 1 on Node 1 -->
  <rect x="615" y="35" width="310" height="90" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="630" y="50" width="90" height="60" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="675" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#065f46">Pod 1</text>
  <text x="675" y="95" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#059669">app:v1.4</text>
  <text x="740" y="73" font-size="13" font-weight="700" fill="#0f172a">web-app-7d9f8b-x2k</text>
  <text x="740" y="95" font-size="12" fill="#64748b">Scheduled on <tspan font-weight="700" fill="#334155">Node 1</tspan></text>
  <circle cx="900" cy="80" r="8" fill="#10b981"/>

  <!-- Pod 2 on Node 2 -->
  <rect x="615" y="135" width="310" height="90" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="630" y="150" width="90" height="60" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="675" y="177" text-anchor="middle" font-size="13" font-weight="800" fill="#065f46">Pod 2</text>
  <text x="675" y="195" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#059669">app:v1.4</text>
  <text x="740" y="173" font-size="13" font-weight="700" fill="#0f172a">web-app-7d9f8b-m9p</text>
  <text x="740" y="195" font-size="12" fill="#64748b">Scheduled on <tspan font-weight="700" fill="#334155">Node 2</tspan></text>
  <circle cx="900" cy="180" r="8" fill="#10b981"/>

  <!-- Pod 3 on Node 3 -->
  <rect x="615" y="235" width="310" height="90" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="630" y="250" width="90" height="60" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="675" y="277" text-anchor="middle" font-size="13" font-weight="800" fill="#065f46">Pod 3</text>
  <text x="675" y="295" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#059669">app:v1.4</text>
  <text x="740" y="273" font-size="13" font-weight="700" fill="#0f172a">web-app-7d9f8b-q4v</text>
  <text x="740" y="295" font-size="12" fill="#64748b">Scheduled on <tspan font-weight="700" fill="#334155">Node 3</tspan></text>
  <circle cx="900" cy="280" r="8" fill="#10b981"/>
</svg>
