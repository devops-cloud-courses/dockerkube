<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="960" height="340" rx="16" fill="#f8fafc"/>

  <!-- Worker Node -->
  <rect x="25" y="30" width="665" height="280" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="18" width="210" height="24" rx="12" fill="#0f172a"/>
  <text x="155" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">KUBERNETES WORKER NODE</text>

  <!-- App Pod -->
  <rect x="50" y="75" width="185" height="195" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="65" y="64" width="90" height="22" rx="11" fill="#2563eb"/>
  <text x="110" y="79" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">APP POD</text>
  <rect x="68" y="105" width="150" height="140" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="143" y="148" text-anchor="middle" font-size="13" font-weight="800" fill="#1e3a8a">App Container</text>
  <text x="143" y="180" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#2563eb">stdout / stderr</text>

  <!-- Arrow App -> Node Disk -->
  <line x1="235" y1="175" x2="280" y2="175" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Node Disk -->
  <rect x="285" y="100" width="150" height="145" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="145" text-anchor="middle" font-size="12" font-weight="800" fill="#92400e">Node Log Dir</text>
  <text x="360" y="172" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#b45309">/var/log/pods</text>
  <text x="360" y="198" text-anchor="middle" font-size="10" fill="#78350f">hostPath mount</text>

  <!-- Arrow Disk -> Logging Agent -->
  <line x1="435" y1="175" x2="480" y2="175" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- DaemonSet Logging Agent -->
  <rect x="485" y="75" width="180" height="195" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="500" y="64" width="145" height="22" rx="11" fill="#059669"/>
  <text x="572" y="79" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">DAEMONSET AGENT</text>
  <rect x="502" y="105" width="146" height="140" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.5"/>
  <text x="575" y="142" text-anchor="middle" font-size="13" font-weight="800" fill="#065f46">Logging Agent</text>
  <text x="575" y="168" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#059669">Fluent Bit / Vector</text>
  <text x="575" y="195" text-anchor="middle" font-size="10" fill="#475569">Enriches with K8s</text>
  <text x="575" y="210" text-anchor="middle" font-size="10" fill="#475569">Pod metadata</text>

  <!-- Arrow Agent -> Central Backend -->
  <line x1="665" y1="175" x2="730" y2="175" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="698" y="162" text-anchor="middle" font-size="10" font-weight="700" fill="#059669">ships</text>

  <!-- Central Logging Backend -->
  <rect x="735" y="75" width="200" height="195" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="755" y="64" width="160" height="22" rx="11" fill="#4f46e5"/>
  <text x="835" y="79" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">LOGGING BACKEND</text>
  <text x="835" y="135" text-anchor="middle" font-size="14" font-weight="800" fill="#312e81">Central Storage</text>
  <text x="835" y="165" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#4f46e5">Grafana Loki</text>
  <text x="835" y="188" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#4f46e5">OpenSearch / ELK</text>
  <text x="835" y="211" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#4f46e5">Datadog / Cloud</text>
</svg>
