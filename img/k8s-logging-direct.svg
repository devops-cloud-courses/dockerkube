<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect width="960" height="340" rx="16" fill="#f8fafc"/>

  <!-- Worker Node -->
  <rect x="40" y="30" width="510" height="280" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="65" y="18" width="210" height="24" rx="12" fill="#0f172a"/>
  <text x="170" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">KUBERNETES WORKER NODE</text>

  <!-- Pod -->
  <rect x="80" y="70" width="430" height="205" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="100" y="59" width="110" height="22" rx="11" fill="#2563eb"/>
  <text x="155" y="74" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">APP POD</text>

  <!-- App Container -->
  <rect x="110" y="100" width="370" height="150" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="295" y="138" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a">Application Container</text>
  <text x="295" y="166" text-anchor="middle" font-size="12" fill="#475569">Instrumented with <tspan font-weight="700" fill="#2563eb">OpenTelemetry SDK</tspan></text>
  <rect x="155" y="185" width="280" height="42" rx="8" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="295" y="210" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#4f46e5">OTLP / HTTPS Log Exporter</text>

  <!-- Arrow Direct Push -->
  <line x1="480" y1="175" x2="645" y2="175" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrowIndigo)"/>
  <rect x="520" y="142" width="110" height="22" rx="11" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="575" y="157" text-anchor="middle" font-size="10" font-weight="700" fill="#4f46e5">Direct Push</text>

  <!-- Central Logging Backend -->
  <rect x="655" y="65" width="265" height="215" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="680" y="53" width="215" height="24" rx="12" fill="#4f46e5"/>
  <text x="787" y="69" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">OBSERVABILITY PLATFORM</text>
  <text x="787" y="122" text-anchor="middle" font-size="15" font-weight="800" fill="#312e81">Log Ingestion API</text>
  <text x="787" y="155" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#4f46e5">OTel Collector / Loki</text>
  <text x="787" y="182" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#4f46e5">Datadog / Honeycomb</text>
  <text x="787" y="225" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">Note: Bypasses kubectl logs</text>
</svg>
