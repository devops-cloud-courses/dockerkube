<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 6 904 316" width="1120" height="392" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="28" y="6" width="904" height="316" rx="16" fill="#f8fafc"/>

  <!-- Worker Node -->
  <rect x="40" y="30" width="880" height="280" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="65" y="18" width="210" height="24" rx="12" fill="#0f172a"/>
  <text x="170" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">KUBERNETES WORKER NODE</text>

  <!-- Pod -->
  <rect x="75" y="75" width="250" height="195" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="95" y="64" width="90" height="22" rx="11" fill="#2563eb"/>
  <text x="140" y="79" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">POD</text>

  <rect x="100" y="105" width="200" height="140" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="200" y="145" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e3a8a">App Container</text>
  <text x="200" y="172" text-anchor="middle" font-size="12" fill="#475569">Writes logs to</text>
  <rect x="125" y="188" width="150" height="30" rx="6" fill="#dbeafe"/>
  <text x="200" y="208" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#1d4ed8">stdout / stderr</text>

  <!-- Arrow to Container Runtime -->
  <line x1="325" y1="175" x2="405" y2="175" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="365" y="163" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563eb">streams</text>

  <!-- Container Runtime & kubelet -->
  <rect x="415" y="95" width="195" height="155" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="512" y="138" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a">containerd / CRI</text>
  <text x="512" y="162" text-anchor="middle" font-size="12" fill="#475569">Captures streams &amp;</text>
  <text x="512" y="180" text-anchor="middle" font-size="12" fill="#475569">manages log rotation</text>
  <text x="512" y="215" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#2563eb">kubelet log rotation</text>

  <!-- Arrow to /var/log/pods -->
  <line x1="610" y1="175" x2="685" y2="175" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <text x="647" y="163" text-anchor="middle" font-size="11.5" font-weight="700" fill="#d97706">writes</text>

  <!-- Node Disk Log Files -->
  <rect x="695" y="85" width="190" height="175" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="790" y="122" text-anchor="middle" font-size="13.5" font-weight="800" fill="#92400e">Node Local Disk</text>
  <rect x="712" y="138" width="156" height="32" rx="6" fill="#fef3c7"/>
  <text x="790" y="158" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#b45309">/var/log/pods/*.log</text>
  <text x="790" y="195" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#78350f">0.log → 0.log.1.gz</text>
  <text x="790" y="225" text-anchor="middle" font-size="12" font-weight="600" fill="#d97706">Served via kubectl logs</text>
</svg>
