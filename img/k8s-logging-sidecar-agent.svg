<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="960" height="340" rx="16" fill="#f8fafc"/>

  <!-- Worker Node -->
  <rect x="25" y="30" width="665" height="280" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="18" width="210" height="24" rx="12" fill="#0f172a"/>
  <text x="155" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">KUBERNETES WORKER NODE</text>

  <!-- Pod -->
  <rect x="50" y="65" width="615" height="215" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="70" y="54" width="240" height="22" rx="11" fill="#2563eb"/>
  <text x="190" y="69" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">POD (DEDICATED SIDECAR AGENT)</text>

  <!-- App Container -->
  <rect x="70" y="95" width="170" height="160" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="155" y="140" text-anchor="middle" font-size="13" font-weight="800" fill="#1e3a8a">App Container</text>
  <text x="155" y="168" text-anchor="middle" font-size="11" fill="#475569">Writes custom log</text>
  <text x="155" y="186" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#2563eb">/var/log/app.json</text>

  <line x1="240" y1="175" x2="280" y2="175" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Shared Volume -->
  <rect x="285" y="115" width="135" height="120" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="352" y="158" text-anchor="middle" font-size="12" font-weight="800" fill="#92400e">emptyDir Volume</text>
  <text x="352" y="182" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#b45309">/var/log/app.json</text>

  <line x1="420" y1="175" x2="460" y2="175" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Sidecar Agent -->
  <rect x="465" y="95" width="180" height="160" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="555" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#065f46">Sidecar Agent</text>
  <text x="555" y="156" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#059669">Fluent Bit / Vector</text>
  <text x="555" y="182" text-anchor="middle" font-size="10" fill="#475569">Parses &amp; ships directly</text>
  <text x="555" y="200" text-anchor="middle" font-size="10" fill="#475569">from inside the Pod</text>

  <!-- Arrow Sidecar -> Central Backend -->
  <line x1="645" y1="175" x2="730" y2="175" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Central Logging Backend -->
  <rect x="735" y="75" width="200" height="195" rx="14" fill="#ffffff" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="755" y="64" width="160" height="22" rx="11" fill="#4f46e5"/>
  <text x="835" y="79" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">LOGGING BACKEND</text>
  <text x="835" y="135" text-anchor="middle" font-size="14" font-weight="800" fill="#312e81">Central Storage</text>
  <text x="835" y="165" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#4f46e5">Grafana Loki</text>
  <text x="835" y="188" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#4f46e5">OpenSearch / ELK</text>
  <text x="835" y="211" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#4f46e5">Datadog / Cloud</text>
</svg>
