<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="960" height="340" rx="16" fill="#f8fafc"/>

  <!-- Worker Node -->
  <rect x="30" y="30" width="900" height="280" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="55" y="18" width="210" height="24" rx="12" fill="#0f172a"/>
  <text x="160" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">KUBERNETES WORKER NODE</text>

  <!-- Pod -->
  <rect x="55" y="65" width="590" height="215" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="75" y="54" width="230" height="22" rx="11" fill="#2563eb"/>
  <text x="190" y="69" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">POD (SHARED VOLUME + SIDECAR)</text>

  <!-- App Container -->
  <rect x="75" y="95" width="165" height="160" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="157" y="138" text-anchor="middle" font-size="13" font-weight="800" fill="#1e3a8a">App Container</text>
  <text x="157" y="165" text-anchor="middle" font-size="11" fill="#475569">Writes custom files</text>
  <text x="157" y="190" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#2563eb">access.log / error.log</text>

  <line x1="240" y1="175" x2="275" y2="175" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Shared Volume -->
  <rect x="280" y="115" width="130" height="120" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="345" y="158" text-anchor="middle" font-size="12" font-weight="800" fill="#92400e">emptyDir Volume</text>
  <text x="345" y="182" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#b45309">/var/log/app/</text>

  <line x1="410" y1="175" x2="445" y2="175" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Streaming Sidecar -->
  <rect x="450" y="95" width="175" height="160" rx="10" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <text x="537" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#065f46">Streaming Sidecar</text>
  <text x="537" y="158" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#059669">tail -F /var/log/app/*</text>
  <text x="537" y="185" text-anchor="middle" font-size="11" fill="#475569">Redirects to</text>
  <text x="537" y="205" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#059669">stdout / stderr</text>

  <!-- Arrow Sidecar -> Node Log -->
  <line x1="625" y1="175" x2="700" y2="175" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Node Log Files -->
  <rect x="705" y="95" width="195" height="160" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="802" y="138" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">kubelet / CRI</text>
  <text x="802" y="165" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#2563eb">/var/log/pods/*.log</text>
  <text x="802" y="195" text-anchor="middle" font-size="11" fill="#475569">Collected by standard</text>
  <text x="802" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">Node Agent &amp; kubectl logs</text>
</svg>
