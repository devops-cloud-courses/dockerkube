<svg xmlns="http://www.w3.org/2000/svg" viewBox="48 10 864 332" width="1120" height="430" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="48" y="10" width="864" height="332" rx="16" fill="#f8fafc"/>

  <!-- Service LB -->
  <rect x="310" y="22" width="340" height="58" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="47" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1e40af">Service Load Balancer (app: web)</text>
  <text x="480" y="66" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="600">100% Traffic Routed to 3 Ready v1 Pods</text>

  <!-- ReplicaSet v1 -->
  <rect x="60" y="120" width="840" height="210" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="85" y="108" width="235" height="24" rx="12" fill="#2563eb"/>
  <text x="202" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">REPLICASET v1 (3 / 3 REPLICAS)</text>

  <!-- Pod 1 v1 -->
  <rect x="100" y="160" width="220" height="140" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="210" y="195" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e3a8a">Pod 1</text>
  <rect x="150" y="212" width="120" height="28" rx="14" fill="#2563eb"/>
  <text x="210" y="230" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#ffffff">app:v1.0</text>
  <text x="210" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">● Ready (Node 1)</text>

  <!-- Pod 2 v1 -->
  <rect x="370" y="160" width="220" height="140" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="480" y="195" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e3a8a">Pod 2</text>
  <rect x="420" y="212" width="120" height="28" rx="14" fill="#2563eb"/>
  <text x="480" y="230" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#ffffff">app:v1.0</text>
  <text x="480" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">● Ready (Node 2)</text>

  <!-- Pod 3 v1 -->
  <rect x="640" y="160" width="220" height="140" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="750" y="195" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e3a8a">Pod 3</text>
  <rect x="690" y="212" width="120" height="28" rx="14" fill="#2563eb"/>
  <text x="750" y="230" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#ffffff">app:v1.0</text>
  <text x="750" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">● Ready (Node 3)</text>

  <!-- Traffic Arrows -->
  <path d="M 400 80 L 210 155" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 480 80 L 480 155" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 560 80 L 750 155" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
</svg>
