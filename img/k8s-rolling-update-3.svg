<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 10 924 332" width="1120" height="402" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="18" y="10" width="924" height="332" rx="16" fill="#f8fafc"/>

  <!-- Service LB -->
  <rect x="300" y="22" width="360" height="58" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="47" text-anchor="middle" font-size="13.5" font-weight="800" fill="#065f46">Service Load Balancer (app: web)</text>
  <text x="480" y="66" text-anchor="middle" font-size="12" fill="#059669" font-weight="700">Routes traffic to 1 Ready v1 Pod + 2 Ready v2 Pods</text>

  <!-- ReplicaSet v1 (Scaling down) -->
  <rect x="30" y="120" width="420" height="210" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="55" y="108" width="235" height="24" rx="12" fill="#2563eb"/>
  <text x="172" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">REPLICASET v1 (1 / 3 REPLICAS)</text>

  <!-- Pod 1 v1 -->
  <rect x="55" y="160" width="175" height="140" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="142" y="195" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e3a8a">Pod 1</text>
  <rect x="87" y="212" width="110" height="26" rx="13" fill="#2563eb"/>
  <text x="142" y="229" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">app:v1.0</text>
  <text x="142" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">● Ready</text>

  <!-- Pod 2 v1 Terminating -->
  <rect x="250" y="160" width="175" height="140" rx="12" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="337" y="195" text-anchor="middle" font-size="14.5" font-weight="800" fill="#991b1b">Pod 2</text>
  <rect x="282" y="212" width="110" height="26" rx="13" fill="#ef4444"/>
  <text x="337" y="229" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">app:v1.0</text>
  <text x="337" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">✕ Terminating</text>

  <!-- ReplicaSet v2 (Scaling up) -->
  <rect x="475" y="120" width="455" height="210" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="500" y="108" width="235" height="24" rx="12" fill="#059669"/>
  <text x="617" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">REPLICASET v2 (2 / 3 REPLICAS)</text>

  <!-- Pod 4 v2 -->
  <rect x="500" y="160" width="190" height="140" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="595" y="195" text-anchor="middle" font-size="14.5" font-weight="800" fill="#065f46">Pod 4</text>
  <rect x="535" y="212" width="120" height="26" rx="13" fill="#059669"/>
  <text x="595" y="229" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">app:v2.0</text>
  <text x="595" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">● Ready</text>

  <!-- Pod 5 v2 -->
  <rect x="715" y="160" width="190" height="140" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="810" y="195" text-anchor="middle" font-size="14.5" font-weight="800" fill="#065f46">Pod 5 (New)</text>
  <rect x="750" y="212" width="120" height="26" rx="13" fill="#059669"/>
  <text x="810" y="229" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ffffff">app:v2.0</text>
  <text x="810" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">● Ready</text>

  <!-- Traffic Arrows -->
  <path d="M 380 80 L 142 155" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 500 80 L 595 155" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 590 80 L 810 155" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
</svg>
