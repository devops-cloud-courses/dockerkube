<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="960" height="360" rx="16" fill="#f8fafc"/>

  <!-- Service LB -->
  <rect x="300" y="22" width="360" height="58" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="480" y="47" text-anchor="middle" font-size="13" font-weight="800" fill="#065f46">Service Load Balancer (app: web)</text>
  <text x="480" y="66" text-anchor="middle" font-size="11" fill="#059669" font-weight="700">100% Traffic Routed to 3 Ready v2 Pods</text>

  <!-- ReplicaSet v1 (0 Replicas, retained for rollback) -->
  <rect x="30" y="120" width="215" height="210" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="50" y="108" width="175" height="24" rx="12" fill="#64748b"/>
  <text x="137" y="124" text-anchor="middle" font-size="10" font-weight="700" fill="#ffffff">REPLICASET v1 (0 / 3)</text>
  <text x="137" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">0 Active Pods</text>
  <text x="137" y="220" text-anchor="middle" font-size="11" fill="#64748b">Retained in history</text>
  <text x="137" y="240" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#2563eb">kubectl rollout undo</text>

  <!-- ReplicaSet v2 (3/3 Replicas) -->
  <rect x="270" y="120" width="660" height="210" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="295" y="108" width="235" height="24" rx="12" fill="#059669"/>
  <text x="412" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">REPLICASET v2 (3 / 3 REPLICAS)</text>

  <!-- Pod 4 v2 -->
  <rect x="295" y="160" width="190" height="140" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="390" y="195" text-anchor="middle" font-size="14" font-weight="800" fill="#065f46">Pod 4</text>
  <rect x="330" y="212" width="120" height="26" rx="13" fill="#059669"/>
  <text x="390" y="229" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">app:v2.0</text>
  <text x="390" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">● Ready (Node 1)</text>

  <!-- Pod 5 v2 -->
  <rect x="505" y="160" width="190" height="140" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="600" y="195" text-anchor="middle" font-size="14" font-weight="800" fill="#065f46">Pod 5</text>
  <rect x="540" y="212" width="120" height="26" rx="13" fill="#059669"/>
  <text x="600" y="229" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">app:v2.0</text>
  <text x="600" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">● Ready (Node 2)</text>

  <!-- Pod 6 v2 -->
  <rect x="715" y="160" width="190" height="140" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="810" y="195" text-anchor="middle" font-size="14" font-weight="800" fill="#065f46">Pod 6 (New)</text>
  <rect x="750" y="212" width="120" height="26" rx="13" fill="#059669"/>
  <text x="810" y="229" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">app:v2.0</text>
  <text x="810" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">● Ready (Node 3)</text>

  <!-- Traffic Arrows -->
  <path d="M 420 80 L 390 155" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 500 80 L 600 155" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 580 80 L 810 155" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#arrowGreen)"/>
</svg>
