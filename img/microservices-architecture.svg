<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 10 928 400" width="1120" height="483" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="msArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <filter id="msShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="16" y="10" width="928" height="400" rx="16" fill="#f8fafc"/>

  <!-- Outer Bridge Network -->
  <rect x="210" y="22" width="722" height="376" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="571" y="50" text-anchor="middle" font-size="15" font-weight="800" fill="#1e40af">Docker Compose Bridge Network (Polyglot Microservices Stack)</text>

  <!-- Users on Left -->
  <g filter="url(#msShadow)" text-anchor="middle">
    <rect x="28" y="88" width="140" height="94" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="98" y="130" font-size="14.5" font-weight="800" fill="#0f172a">Voters</text>
    <text x="98" y="152" font-size="12" font-family="'JetBrains Mono', monospace" fill="#2563eb">HTTP :5000</text>

    <rect x="28" y="238" width="140" height="94" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="98" y="280" font-size="14.5" font-weight="800" fill="#0f172a">Admins</text>
    <text x="98" y="302" font-size="12" font-family="'JetBrains Mono', monospace" fill="#059669">HTTP + WS :5001</text>

    <!-- Python Voting App Container -->
    <rect x="242" y="76" width="194" height="118" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="258" y="90" width="162" height="28" rx="6" fill="#dbeafe"/>
    <text x="339" y="109" font-size="12.5" font-weight="800" fill="#1d4ed8">CONTAINER #1</text>
    <text x="339" y="142" font-size="15" font-weight="800" fill="#0f172a">Voting Web App</text>
    <text x="339" y="166" font-size="12.5" font-family="'JetBrains Mono', monospace" fill="#475569">Python 3.12 + Flask</text>

    <!-- Node.js Results App Container -->
    <rect x="242" y="226" width="194" height="118" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="258" y="240" width="162" height="28" rx="6" fill="#d1fae5"/>
    <text x="339" y="259" font-size="12.5" font-weight="800" fill="#047857">CONTAINER #2</text>
    <text x="339" y="292" font-size="15" font-weight="800" fill="#0f172a">Live Results App</text>
    <text x="339" y="316" font-size="12.5" font-family="'JetBrains Mono', monospace" fill="#475569">Node.js + Socket.IO</text>

    <!-- Redis Queue Container -->
    <rect x="488" y="76" width="184" height="118" rx="14" fill="#ffffff" stroke="#f43f5e" stroke-width="2"/>
    <rect x="504" y="90" width="152" height="28" rx="6" fill="#ffe4e6"/>
    <text x="580" y="109" font-size="12.5" font-weight="800" fill="#be123c">CONTAINER #3</text>
    <text x="580" y="142" font-size="15" font-weight="800" fill="#0f172a">In-Memory Queue</text>
    <text x="580" y="166" font-size="12.5" font-family="'JetBrains Mono', monospace" fill="#475569">redis:7-alpine</text>

    <!-- PostgreSQL DB Container -->
    <rect x="488" y="226" width="184" height="142" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <rect x="504" y="240" width="152" height="28" rx="6" fill="#e0e7ff"/>
    <text x="580" y="259" font-size="12.5" font-weight="800" fill="#4338ca">CONTAINER #4</text>
    <text x="580" y="290" font-size="15" font-weight="800" fill="#0f172a">PostgreSQL DB</text>
    <text x="580" y="312" font-size="12.5" font-family="'JetBrains Mono', monospace" fill="#475569">postgres:16</text>
    <rect x="508" y="324" width="144" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="580" y="344" font-size="11.5" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#334155">💾 Volume: db-data</text>

    <!-- Worker Container -->
    <rect x="724" y="150" width="184" height="118" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect x="740" y="164" width="152" height="28" rx="6" fill="#fef3c7"/>
    <text x="816" y="183" font-size="12.5" font-weight="800" fill="#b45309">CONTAINER #5</text>
    <text x="816" y="216" font-size="15" font-weight="800" fill="#0f172a">Queue Worker</text>
    <text x="816" y="240" font-size="12.5" font-family="'JetBrains Mono', monospace" fill="#475569">.NET / Go Service</text>
  </g>

  <!-- Flow Arrows -->
  <line x1="168" y1="135" x2="234" y2="135" stroke="#2563eb" stroke-width="2.5" marker-end="url(#msArrow)"/>
  <line x1="168" y1="285" x2="234" y2="285" stroke="#2563eb" stroke-width="2.5" marker-end="url(#msArrow)"/>
  <line x1="436" y1="135" x2="480" y2="135" stroke="#2563eb" stroke-width="2.5" marker-end="url(#msArrow)"/>
  <line x1="488" y1="285" x2="444" y2="285" stroke="#2563eb" stroke-width="2.5" marker-end="url(#msArrow)"/>
  <path d="M 672 135 L 816 135 L 816 144" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#msArrow)"/>
  <path d="M 816 268 L 816 285 L 680 285" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#msArrow)"/>
</svg>
