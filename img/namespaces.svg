<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 12 916 396" width="1120" height="484" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="nsKernelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="nsArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <filter id="nsShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="22" y="12" width="916" height="396" rx="16" fill="#f8fafc"/>

  <!-- Host Root Namespace Container -->
  <rect x="34" y="24" width="892" height="290" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#nsShadow)"/>
  <text x="64" y="58" font-size="17" font-weight="800" fill="#0f172a">Host System (Root PID Namespace)</text>
  <text x="896" y="58" text-anchor="end" font-size="13" font-family="'JetBrains Mono', monospace" fill="#64748b">Global view of all processes</text>

  <!-- Host PID 1 -->
  <rect x="64" y="84" width="160" height="54" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="144" y="109" text-anchor="middle" font-size="14.5" font-weight="800" fill="#0f172a">PID 1 (systemd)</text>
  <text x="144" y="127" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#64748b">Host Init Process</text>

  <!-- Host PID 1237 (containerd-shim) -->
  <rect x="274" y="128" width="174" height="54" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="361" y="153" text-anchor="middle" font-size="14" font-weight="800" fill="#1e40af">PID 1237</text>
  <text x="361" y="171" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#2563eb">containerd-shim</text>

  <!-- Host Other Processes -->
  <rect x="274" y="220" width="174" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="361" y="245" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569">PID 842, 910, ...</text>
  <text x="361" y="263" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#64748b">sshd, cron, journald</text>

  <!-- Arrows from Host PID 1 -->
  <path d="M 144 138 L 144 155 L 266 155" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#nsArrow)"/>
  <path d="M 144 138 L 144 247 L 266 247" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#nsArrow)"/>

  <!-- Child Container PID Namespace Box -->
  <rect x="506" y="78" width="390" height="214" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="701" y="108" text-anchor="middle" font-size="15.5" font-weight="800" fill="#065f46">Container PID Namespace #1 (Isolated)</text>

  <!-- Container PID 1 (Host PID 1238) -->
  <rect x="536" y="128" width="210" height="56" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="641" y="153" text-anchor="middle" font-size="14.5" font-weight="800" fill="#065f46">Container PID 1</text>
  <text x="641" y="172" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#059669">Host PID: 1238 (nginx master)</text>

  <!-- Container PID 2 (Host PID 1241) -->
  <rect x="656" y="212" width="214" height="56" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
  <text x="763" y="237" text-anchor="middle" font-size="14.5" font-weight="800" fill="#0f172a">Container PID 2</text>
  <text x="763" y="256" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748b">Host PID: 1241 (nginx worker)</text>

  <!-- Arrows into & inside Container Namespace -->
  <line x1="448" y1="155" x2="528" y2="155" stroke="#2563eb" stroke-width="2.5" marker-end="url(#nsArrow)"/>
  <path d="M 600 184 L 600 240 L 648 240" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#nsArrow)"/>

  <!-- Bottom: Shared Linux Kernel -->
  <g filter="url(#nsShadow)">
    <rect x="34" y="332" width="892" height="64" rx="14" fill="url(#nsKernelGrad)"/>
    <text x="480" y="362" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Shared Linux Kernel</text>
    <text x="480" y="382" text-anchor="middle" font-size="12.5" font-family="'JetBrains Mono', monospace" fill="#93c5fd">Enforces pid • net • mnt • uts • ipc • user • cgroup namespaces via syscalls (clone / unshare)</text>
  </g>
</svg>
