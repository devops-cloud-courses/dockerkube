<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <filter id="lwShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="440" rx="16" fill="#f8fafc"/>

  <!-- Left: Virtual Machines (Full Duplication) -->
  <rect x="24" y="20" width="430" height="400" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="239" y="52" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">Virtual Machines</text>
  <text x="239" y="74" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#dc2626" font-weight="700">Every copy or small update duplicates the entire OS</text>

  <g filter="url(#lwShadow)" text-anchor="middle">
    <!-- VM 1: Original -->
    <rect x="48" y="96" width="112" height="236" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="56" y="106" width="96" height="50" rx="6" fill="#3b82f6"/>
    <text x="104" y="136" font-size="13" font-weight="800" fill="#ffffff">App A</text>
    <rect x="56" y="162" width="96" height="44" rx="6" fill="#f59e0b"/>
    <text x="104" y="189" font-size="12" font-weight="800" fill="#ffffff">Bins / Libs</text>
    <rect x="56" y="212" width="96" height="110" rx="6" fill="#7c3aed"/>
    <text x="104" y="264" font-size="13" font-weight="800" fill="#ffffff">Guest OS</text>
    <text x="104" y="284" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#e9d5ff">(4–10 GB)</text>
    <text x="104" y="356" font-size="12" font-weight="700" fill="#334155">Original App</text>

    <!-- VM 2: Copy -->
    <rect x="183" y="96" width="112" height="236" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="191" y="106" width="96" height="50" rx="6" fill="#3b82f6"/>
    <text x="239" y="136" font-size="13" font-weight="800" fill="#ffffff">App A</text>
    <rect x="191" y="162" width="96" height="44" rx="6" fill="#f59e0b"/>
    <text x="239" y="189" font-size="12" font-weight="800" fill="#ffffff">Bins / Libs</text>
    <rect x="191" y="212" width="96" height="110" rx="6" fill="#7c3aed"/>
    <text x="239" y="264" font-size="13" font-weight="800" fill="#ffffff">Guest OS</text>
    <text x="239" y="284" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#e9d5ff">(4–10 GB)</text>
    <text x="239" y="356" font-size="12" font-weight="700" fill="#334155">2nd Instance</text>

    <!-- VM 3: Modified -->
    <rect x="318" y="96" width="112" height="236" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="326" y="106" width="96" height="50" rx="6" fill="#2563eb"/>
    <text x="374" y="136" font-size="13" font-weight="800" fill="#ffffff">App A'</text>
    <rect x="326" y="162" width="96" height="44" rx="6" fill="#f59e0b"/>
    <text x="374" y="189" font-size="12" font-weight="800" fill="#ffffff">Bins / Libs</text>
    <rect x="326" y="212" width="96" height="110" rx="6" fill="#7c3aed"/>
    <text x="374" y="264" font-size="13" font-weight="800" fill="#ffffff">Guest OS</text>
    <text x="374" y="284" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#e9d5ff">(4–10 GB)</text>
    <text x="374" y="356" font-size="12" font-weight="700" fill="#334155">Updated App A'</text>
  </g>
  <text x="239" y="395" text-anchor="middle" font-size="11.5" fill="#64748b">3 full OS copies stored in memory &amp; disk</text>

  <!-- Right: Containers (Shared Layers & Copy-on-Write) -->
  <rect x="478" y="20" width="458" height="400" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="707" y="52" text-anchor="middle" font-size="17" font-weight="800" fill="#1e40af">Containers (Layer Sharing &amp; Copy-on-Write)</text>
  <text x="707" y="74" text-anchor="middle" font-size="11.5" font-family="'JetBrains Mono', monospace" fill="#059669" font-weight="700">No Guest OS • Shared Read-Only Layers • Only Diffs Stored</text>

  <g filter="url(#lwShadow)" text-anchor="middle">
    <!-- Container 1: Original -->
    <rect x="504" y="96" width="118" height="126" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="512" y="106" width="102" height="54" rx="6" fill="#3b82f6"/>
    <text x="563" y="138" font-size="13" font-weight="800" fill="#ffffff">App A</text>
    <rect x="512" y="166" width="102" height="46" rx="6" fill="#f59e0b"/>
    <text x="563" y="194" font-size="12" font-weight="800" fill="#ffffff">Bins / Libs</text>

    <text x="563" y="256" font-size="13" font-weight="800" fill="#0f172a">Original App</text>
    <text x="563" y="278" font-size="11" fill="#475569">No Guest OS overhead</text>
    <text x="563" y="296" font-size="11" fill="#475569">Instant startup</text>

    <!-- Container 2: Copy -->
    <rect x="648" y="96" width="118" height="126" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="656" y="106" width="102" height="54" rx="6" fill="#3b82f6"/>
    <text x="707" y="138" font-size="13" font-weight="800" fill="#ffffff">App A</text>
    <rect x="656" y="166" width="102" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="707" y="194" font-size="11" font-weight="700" fill="#b45309">Shared Layer</text>

    <text x="707" y="256" font-size="13" font-weight="800" fill="#0f172a">Copy of App</text>
    <text x="707" y="278" font-size="11" fill="#475569">Reuses existing</text>
    <text x="707" y="296" font-size="11" fill="#059669" font-weight="700">Bins/Libs in-place (0 MB)</text>

    <!-- Container 3: Modified (Delta only) -->
    <rect x="792" y="96" width="118" height="126" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="800" y="106" width="68" height="54" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-dasharray="4 3"/>
    <text x="834" y="138" font-size="10.5" font-weight="700" fill="#1e40af">Shared</text>
    <rect x="872" y="106" width="30" height="54" rx="6" fill="#10b981"/>
    <text x="887" y="138" font-size="11" font-weight="800" fill="#ffffff">Δ</text>
    <rect x="800" y="166" width="102" height="46" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="851" y="194" font-size="11" font-weight="700" fill="#b45309">Shared Layer</text>

    <text x="851" y="256" font-size="13" font-weight="800" fill="#0f172a">Updated App A'</text>
    <text x="851" y="278" font-size="11" fill="#475569">Copy-on-Write saves &amp;</text>
    <text x="851" y="296" font-size="11" fill="#059669" font-weight="700">pulls only the diff (Δ)</text>
  </g>

  <rect x="504" y="340" width="406" height="54" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="707" y="365" text-anchor="middle" font-size="12.5" font-weight="800" fill="#065f46">10–100× Higher Compute Density &amp; Sub-Second Deploys</text>
  <text x="707" y="383" text-anchor="middle" font-size="11" font-family="'JetBrains Mono', monospace" fill="#047857">Image updates transfer only changed layers over the network</text>
</svg>
