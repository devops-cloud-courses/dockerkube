<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Docker &amp; Kubernetes in a nutshell</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Reveal.js 6.0.2 Core & Theme Styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reset.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/theme/white.css" id="theme">

    <!-- Theme used for syntax highlighting of code -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/plugin/highlight/monokai.css">

    <!-- Custom Modern Light Theme (matching Network in a nutshell) -->
    <link rel="stylesheet" href="css/custom.css">
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section data-markdown="slides/title.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n----\r?\n$" data-separator-notes="^Note:" data-charset="utf-8"></section>
        <section data-markdown="slides/introduction.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n----\r?\n$" data-separator-notes="^Note:" data-charset="utf-8"></section>
        <section data-markdown="slides/docker.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n----\r?\n$" data-separator-notes="^Note:" data-charset="utf-8"></section>
        <section data-markdown="slides/kubernetes.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n----\r?\n$" data-separator-notes="^Note:" data-charset="utf-8"></section>
        <section data-markdown="slides/logging.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n----\r?\n$" data-separator-notes="^Note:" data-charset="utf-8"></section>
        <section data-markdown="slides/conclusion.md" data-separator="^\r?\n---\r?\n$" data-separator-vertical="^\r?\n----\r?\n$" data-separator-notes="^Note:" data-charset="utf-8"></section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/plugin/highlight/highlight.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/plugin/notes/notes.js"></script>

    <script>
      Reveal.initialize({
        width: 1200,
        height: 700,
        margin: 0.06,
        controls: true,
        progress: true,
        history: true,
        hash: true,
        center: true,
        slideNumber: 'c/t',
        transition: 'slide',
        plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
      }).then(() => {
        document.querySelectorAll('.reveal img').forEach((img) => {
          if (!img.complete) {
            img.addEventListener('load', () => Reveal.layout(), { once: true });
          }
        });
        Reveal.layout();
      });
    </script>
  </body>
</html>
